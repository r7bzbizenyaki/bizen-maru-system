<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約チケット - 備前丸市民限定内覧会</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .ticket-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }
        
        .ticket-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        
        .ticket-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .ticket-header p {
            font-size: 0.9rem;
            opacity: 0.95;
        }
        
        .ticket-body {
            padding: 30px 20px;
        }
        
        .qr-section {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }
        
        .qr-code {
            max-width: 300px;
            width: 100%;
            height: auto;
            margin: 0 auto 15px;
            display: block;
            border: 3px solid #667eea;
            border-radius: 10px;
            padding: 10px;
            background: white;
        }
        
        .ticket-id {
            font-size: 0.9rem;
            color: #666;
            margin-top: 10px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            background: white;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        
        .ticket-id strong {
            color: #333;
            display: block;
            margin-bottom: 5px;
        }
        
        .info-section {
            margin-top: 25px;
        }
        
        .info-item {
            display: flex;
            padding: 15px;
            border-bottom: 1px solid #eee;
            align-items: flex-start;
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .info-label {
            font-weight: 600;
            color: #667eea;
            min-width: 100px;
            flex-shrink: 0;
            font-size: 0.95rem;
        }
        
        .info-value {
            color: #333;
            flex: 1;
            font-size: 0.95rem;
            word-break: break-word;
        }
        
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            margin-top: 20px;
            width: 100%;
        }
        
        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }
        
        .status-boarded {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status-completed {
            background: #e0e7ff;
            color: #3730a3;
        }
        
        .error-container {
            text-align: center;
            padding: 40px 20px;
        }
        
        .error-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        .error-message {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .error-detail {
            color: #666;
            margin-bottom: 30px;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .notes {
            margin-top: 25px;
            padding: 15px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 5px;
        }
        
        .notes h3 {
            font-size: 0.95rem;
            color: #856404;
            margin-bottom: 8px;
        }
        
        .notes p {
            font-size: 0.85rem;
            color: #856404;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .ticket-header h1 {
                font-size: 1.2rem;
            }
            
            .qr-code {
                max-width: 250px;
            }
            
            .info-item {
                flex-direction: column;
            }
            
            .info-label {
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="ticket-container" id="ticketContainer">
        <div class="loading">
            <div class="spinner"></div>
            <p>チケット情報を読み込んでいます...</p>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLpyqMk8xbnNfDz5H2DHhH_ZLNBSEWDG2pI11zrnRkCFwf3uVvHgrYpr1Asi0ijA1n/exec';
        
        async function loadTicket() {
            const urlParams = new URLSearchParams(window.location.search);
            const ticketId = urlParams.get('id');
            
            if (!ticketId) {
                showError('チケットIDが指定されていません', 'URLが正しくありません。予約画面からやり直してください。');
                return;
            }
            
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getTicketInfo&ticketId=${ticketId}`);
                const data = await response.json();
                
                if (data.success) {
                    displayTicket(data.ticket);
                } else {
                    showError('チケットが見つかりません', data.message || 'このチケットIDは存在しません。');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('読み込みエラー', 'チケット情報の取得に失敗しました。しばらくしてから再度お試しください。');
            }
        }
        
        function displayTicket(ticket) {
            const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${ticket.ticketId}`;
            
            let statusClass = 'status-pending';
            let statusText = '🕒 未乗船';
            
            if (ticket.boardingStatus === '下船済み') {
                statusClass = 'status-completed';
                statusText = '✅ 下船完了';
            } else if (ticket.boardingStatus === '乗船済み') {
                statusClass = 'status-boarded';
                statusText = '🚢 乗船中';
            }
            
            const html = `
                <div class="ticket-header">
                    <h1>備前市 市民限定内覧会チケット</h1>
                    <p>備前丸 特別予約券</p>
                </div>
                <div class="ticket-body">
                    <div class="qr-section">
                        <img src="${qrCodeUrl}" alt="QR Code" class="qr-code">
                        <div class="ticket-id">
                            <strong>チケットID</strong>
                            ${ticket.ticketId}
                        </div>
                    </div>
                    
                    <div class="info-section">
                        <div class="info-item">
                            <span class="info-label">お名前</span>
                            <span class="info-value">${ticket.name} 様</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">予約日</span>
                            <span class="info-value">${ticket.date}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">希望時間枠</span>
                            <span class="info-value">${ticket.timeSlot}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">電話番号</span>
                            <span class="info-value">${ticket.phone}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">メール</span>
                            <span class="info-value">${ticket.email}</span>
                        </div>
                    </div>
                    
                    <div class="status-badge ${statusClass}">
                        ${statusText}
                    </div>
                    
                    <div class="notes">
                        <h3>📌 ご注意</h3>
                        <p>• 当日はこのQRコードを受付でご提示ください<br>
                        • スクリーンショットでも構いません<br>
                        • 指定時間枠の10分前までにお越しください</p>
                    </div>
                </div>
            `;
            
            document.getElementById('ticketContainer').innerHTML = html;
        }
        
        function showError(title, message) {
            const html = `
                <div class="error-container">
                    <div class="error-icon">❌</div>
                    <div class="error-message">${title}</div>
                    <div class="error-detail">${message}</div>
                    <a href="https://r7bzbizenyaki.github.io/bizen-maru-system/entry-form-citizen.html" class="btn">予約画面に戻る</a>
                </div>
            `;
            
            document.getElementById('ticketContainer').innerHTML = html;
        }
        
        // ページ読み込み時にチケット情報を取得
        window.addEventListener('DOMContentLoaded', loadTicket);
    </script>
</body>
</html>
