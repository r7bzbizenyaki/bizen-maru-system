<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙️ マルチイベント管理 - 備前丸システム</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .top-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .event-card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
      position: relative;
    }

    .event-card:hover {
      transform: translateY(-5px);
    }

    .event-card.empty {
      border: 2px dashed #cbd5e0;
      background: #f7fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      cursor: pointer;
    }

    .event-card.empty:hover {
      background: #edf2f7;
      border-color: #a0aec0;
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }

    .event-number {
      font-size: 0.9rem;
      font-weight: 600;
      color: #667eea;
      background: #edf2f7;
      padding: 4px 12px;
      border-radius: 12px;
    }

    .event-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 8px;
    }

    .event-date {
      font-size: 1rem;
      color: #4a5568;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-slots-preview {
      background: #f7fafc;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .time-slots-preview h4 {
      font-size: 0.9rem;
      color: #4a5568;
      margin-bottom: 8px;
    }

    .time-slot-tag {
      display: inline-block;
      background: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin: 3px;
      border: 1px solid #e2e8f0;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
    }

    .btn-success {
      background: #48bb78;
      color: white;
    }

    .btn-success:hover {
      background: #38a169;
    }

    .btn-danger {
      background: #f56565;
      color: white;
    }

    .btn-danger:hover {
      background: #e53e3e;
    }

    .btn-secondary {
      background: #cbd5e0;
      color: #2d3748;
    }

    .btn-secondary:hover {
      background: #a0aec0;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    .card-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.5rem;
      color: #2d3748;
    }

    .close-btn {
      font-size: 1.5rem;
      cursor: pointer;
      color: #a0aec0;
      background: none;
      border: none;
    }

    .close-btn:hover {
      color: #4a5568;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #2d3748;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 2px solid #e2e8f0;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    small {
      display: block;
      margin-top: 4px;
      color: #718096;
      font-size: 0.85rem;
    }

    .time-slots-edit {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .alert {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      animation: slideDown 0.3s ease;
    }

    .alert.success {
      background: #c6f6d5;
      color: #22543d;
      border: 2px solid #48bb78;
    }

    .alert.error {
      background: #fed7d7;
      color: #742a2a;
      border: 2px solid #f56565;
    }

    .alert.show {
      display: block;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: white;
      font-size: 1.2rem;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.8rem;
      }

      .events-grid {
        grid-template-columns: 1fr;
      }

      .top-buttons {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚙️ マルチイベント管理</h1>
      <div class="subtitle">最大5イベントを一括管理・受付期間設定</div>
    </div>

    <div id="alertBox" class="alert"></div>

    <div class="top-buttons">
      <button class="btn btn-primary" onclick="loadAllEvents()">🔄 全イベント再読込</button>
      <button class="btn btn-secondary" onclick="window.open('https://r7bzbizenyaki.github.io/bizen-maru-system/dashboard-citizen.html', '_blank')">📊 ダッシュボード</button>
    </div>

    <div class="events-grid" id="eventsGrid">
      <div class="loading">イベントを読み込んでいます...</div>
    </div>
  </div>

  <!-- 編集モーダル -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">イベント編集</div>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>

      <div class="form-group">
        <label for="editTitle">イベントタイトル</label>
        <input type="text" id="editTitle" placeholder="例: 備前丸市民限定内覧会">
      </div>

      <div class="form-group">
        <label for="editDate">イベント日付</label>
        <input type="text" id="editDate" placeholder="例: 2026-03-15">
      </div>

      <div class="form-group">
        <label for="editStartDateTime">📅 受付開始日時</label>
        <input type="text" id="editStartDateTime" placeholder="例: 2026-02-15 09:00">
        <small>形式: YYYY-MM-DD HH:MM（この日時から予約受付開始）</small>
      </div>

      <div class="form-group">
        <label for="editEndDateTime">📅 受付終了日時</label>
        <input type="text" id="editEndDateTime" placeholder="例: 2026-03-14 23:59">
        <small>形式: YYYY-MM-DD HH:MM（この日時で予約受付終了）</small>
      </div>

      <div class="form-group">
        <label for="editPublicStatus">🔄 公開ステータス</label>
        <select id="editPublicStatus">
          <option value="公開">🟢 公開（予約受付中）</option>
          <option value="非公開">🔴 非公開（予約受付停止）</option>
        </select>
        <small>※ 非公開にすると、受付期間内でも即座に予約を停止できます</small>
      </div>

      <div class="form-group">
        <label>⏰ 乗船時間枠（最大10枠）</label>
        <div class="time-slots-edit" id="timeSlotsEdit"></div>
      </div>

      <div class="form-group">
        <label for="editNotes">ℹ️ 注意事項</label>
        <textarea id="editNotes" placeholder="例: ※当日は受付で本人確認を行います。"></textarea>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn btn-success" onclick="saveEvent()">💾 保存</button>
        <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLpyqMk8xbnNfDz5H2DHhH_ZLNBSEWDG2pI11zrnRkCFwf3uVvHgrYpr1Asi0ijA1n/exec';
    let currentEditingEvent = null;
    let allEvents = [];

    function showAlert(message, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message;
      alertBox.className = `alert ${type} show`;
      setTimeout(() => alertBox.classList.remove('show'), 5000);
    }

    async function loadAllEvents() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getEventSettings&_=${Date.now()}`);
        const data = await response.json();

        console.log('API Response:', data);

        if (data.success) {
          allEvents = data.events || [];
          renderEventsGrid();
          showAlert('✅ イベントを読み込みました', 'success');
        } else {
          showAlert('❌ エラー: ' + data.error, 'error');
          renderEventsGrid();
        }
      } catch (error) {
        console.error('通信エラー:', error);
        showAlert('❌ 通信エラー: ' + error.message, 'error');
        renderEventsGrid();
      }
    }

    function renderEventsGrid() {
      const grid = document.getElementById('eventsGrid');
      grid.innerHTML = '';

      if (allEvents && allEvents.length > 0) {
        allEvents.forEach(event => {
          const card = createEventCard(event);
          grid.appendChild(card);
        });
      }

      const currentEventCount = allEvents ? allEvents.length : 0;
      for (let i = currentEventCount + 1; i <= 5; i++) {
        const emptyCard = createEmptyCard(i);
        grid.appendChild(emptyCard);
      }
    }

    function createEventCard(event) {
      const card = document.createElement('div');
      card.className = 'event-card';

      const eventNumber = event['イベント番号'] || 1;
      const title = event['イベントタイトル'] || '(タイトル未設定)';
      const date = event['イベント日付'] || '(日付未設定)';
      const publicStatus = event['公開ステータス'] || '公開';
      const startDateTime = event['受付開始日時'] || '';
      const endDateTime = event['受付終了日時'] || '';

      let statusBadge = '';
      if (publicStatus === '非公開') {
        statusBadge = '<span style="background:#fed7d7; color:#742a2a; padding:4px 10px; border-radius:8px; font-size:0.8rem; font-weight:600;">🔴 非公開</span>';
      } else {
        statusBadge = '<span style="background:#c6f6d5; color:#22543d; padding:4px 10px; border-radius:8px; font-size:0.8rem; font-weight:600;">🟢 公開中</span>';
      }

      const timeSlots = [];
      for (let i = 1; i <= 10; i++) {
        const slot = event[`時間枠${i}`];
        if (slot) timeSlots.push(slot);
      }

      const timeSlotsHTML = timeSlots.map(slot => 
        `<span class="time-slot-tag">${slot}</span>`
      ).join('');

      const periodInfo = startDateTime || endDateTime 
        ? `<div style="font-size:0.85rem; color:#718096; margin-top:10px; line-height:1.5;">
             ${startDateTime ? `📅 受付開始: ${startDateTime}<br>` : ''}
             ${endDateTime ? `📅 受付終了: ${endDateTime}` : ''}
           </div>`
        : '';

      card.innerHTML = `
        <div class="event-header">
          <div class="event-number">イベント ${eventNumber}</div>
          ${statusBadge}
        </div>
        <div class="event-title">${title}</div>
        <div class="event-date">📅 ${date}</div>
        ${periodInfo}
        <div class="time-slots-preview">
          <h4>⏰ 時間枠 (${timeSlots.length}枠)</h4>
          ${timeSlotsHTML || '<span style="color:#a0aec0;">未設定</span>'}
        </div>
        <div class="card-buttons">
          <button class="btn btn-primary btn-small" onclick="editEvent(${eventNumber})">✏️ 編集</button>
          <button class="btn btn-secondary btn-small" onclick="previewEvent(${eventNumber})">👁️ プレビュー</button>
          <button class="btn btn-danger btn-small" onclick="confirmDeleteEvent(${eventNumber})">🗑️ 削除</button>
        </div>
      `;

      return card;
    }

    function createEmptyCard(eventNumber) {
      const card = document.createElement('div');
      card.className = 'event-card empty';
      card.onclick = () => createNewEvent(eventNumber);
      card.innerHTML = `
        <div style="text-align: center; color: #a0aec0;">
          <div style="font-size: 3rem;">➕</div>
          <div style="font-size: 1.1rem; font-weight: 600;">イベント ${eventNumber} を作成</div>
        </div>
      `;
      return card;
    }

    function createNewEvent(eventNumber) {
      currentEditingEvent = eventNumber;
      document.getElementById('modalTitle').textContent = `イベント ${eventNumber} を作成`;
      document.getElementById('editTitle').value = '';
      document.getElementById('editDate').value = '';
      document.getElementById('editStartDateTime').value = '';
      document.getElementById('editEndDateTime').value = '';
      document.getElementById('editPublicStatus').value = '公開';
      document.getElementById('editNotes').value = '';
      
      const timeSlotsContainer = document.getElementById('timeSlotsEdit');
      timeSlotsContainer.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        timeSlotsContainer.innerHTML += `<input type="text" class="time-slot-input" data-slot="${i}" placeholder="枠${i}">`;
      }

      document.getElementById('editModal').classList.add('active');
    }

    function editEvent(eventNumber) {
      const event = allEvents.find(e => e['イベント番号'] === eventNumber);
      if (!event) {
        showAlert('❌ イベントが見つかりません', 'error');
        return;
      }

      currentEditingEvent = eventNumber;
      document.getElementById('modalTitle').textContent = `イベント ${eventNumber} を編集`;
      document.getElementById('editTitle').value = event['イベントタイトル'] || '';
      document.getElementById('editDate').value = event['イベント日付'] || '';
      document.getElementById('editStartDateTime').value = event['受付開始日時'] || '';
      document.getElementById('editEndDateTime').value = event['受付終了日時'] || '';
      document.getElementById('editPublicStatus').value = event['公開ステータス'] || '公開';
      document.getElementById('editNotes').value = event['注意事項'] || '';

      const timeSlotsContainer = document.getElementById('timeSlotsEdit');
      timeSlotsContainer.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const value = event[`時間枠${i}`] || '';
        timeSlotsContainer.innerHTML += `<input type="text" class="time-slot-input" data-slot="${i}" placeholder="枠${i}" value="${value}">`;
      }

      document.getElementById('editModal').classList.add('active');
    }

    async function saveEvent() {
      if (!currentEditingEvent) {
        showAlert('❌ イベント番号が不正です', 'error');
        return;
      }

      const password = prompt('管理パスワードを入力してください:');
      if (!password) return;

      const settings = {
        'イベントタイトル': document.getElementById('editTitle').value,
        'イベント日付': document.getElementById('editDate').value,
        '受付開始日時': document.getElementById('editStartDateTime').value,
        '受付終了日時': document.getElementById('editEndDateTime').value,
        '公開ステータス': document.getElementById('editPublicStatus').value,
        '注意事項': document.getElementById('editNotes').value
      };

      document.querySelectorAll('.time-slot-input').forEach(input => {
        const slotNum = input.dataset.slot;
        settings[`時間枠${slotNum}`] = input.value;
      });

      try {
        const response = await fetch(
          `${SCRIPT_URL}?action=saveEventSettings&eventNumber=${currentEditingEvent}&settings=${encodeURIComponent(JSON.stringify(settings))}&password=${encodeURIComponent(password)}`
        );
        const result = await response.json();

        if (result.success) {
          showAlert('✅ ' + result.message, 'success');
          closeModal();
          loadAllEvents();
        } else {
          showAlert('❌ エラー: ' + result.error, 'error');
        }
      } catch (error) {
        showAlert('❌ 通信エラー: ' + error.message, 'error');
      }
    }

    function confirmDeleteEvent(eventNumber) {
      if (!confirm(`イベント ${eventNumber} を削除しますか?\nこの操作は元に戻せません。`)) return;
      deleteEvent(eventNumber);
    }

    async function deleteEvent(eventNumber) {
      const password = prompt('管理パスワードを入力してください:');
      if (!password) return;

      try {
        const response = await fetch(
          `${SCRIPT_URL}?action=deleteEvent&eventNumber=${eventNumber}&password=${encodeURIComponent(password)}`
        );
        const result = await response.json();

        if (result.success) {
          showAlert('✅ ' + result.message, 'success');
          loadAllEvents();
        } else {
          showAlert('❌ エラー: ' + result.error, 'error');
        }
      } catch (error) {
        showAlert('❌ 通信エラー: ' + error.message, 'error');
      }
    }

    function previewEvent(eventNumber) {
      const event = allEvents.find(e => e['イベント番号'] === eventNumber);
      if (!event) {
        showAlert('❌ イベントが見つかりません', 'error');
        return;
      }

      const title = event['イベントタイトル'] || '(タイトル未設定)';
      const date = event['イベント日付'] || '(日付未設定)';
      const startDateTime = event['受付開始日時'] || '未設定';
      const endDateTime = event['受付終了日時'] || '未設定';
      const publicStatus = event['公開ステータス'] || '公開';
      const notes = event['注意事項'] || '(注意事項なし)';

      const timeSlots = [];
      for (let i = 1; i <= 10; i++) {
        const slot = event[`時間枠${i}`];
        if (slot) timeSlots.push(slot);
      }

      alert(`【プレビュー】\n\n${title}\n📅 ${date}\n\n🔄 公開ステータス: ${publicStatus}\n📅 受付開始: ${startDateTime}\n📅 受付終了: ${endDateTime}\n\n⏰ 時間枠:\n${timeSlots.join('\n') || '未設定'}\n\nℹ️ 注意事項:\n${notes}`);
    }

    function closeModal() {
      document.getElementById('editModal').classList.remove('active');
      currentEditingEvent = null;
    }

    document.getElementById('editModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });

    loadAllEvents();
  </script>
</body>
</html>
