<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙️ マルチイベント管理 - 備前丸システム</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .header-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    .btn-header {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid white;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-header:hover {
      background: white;
      color: #667eea;
      transform: translateY(-2px);
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }

    .event-card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .event-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .event-header h3 {
      font-size: 1rem;
      color: #999;
      font-weight: 500;
    }

    .status-badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-public {
      background: #c6f6d5;
      color: #22543d;
    }

    .status-private {
      background: #fed7d7;
      color: #742a2a;
    }

    .event-card h2 {
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 10px;
    }

    .event-date {
      color: #666;
      font-size: 1rem;
      margin-bottom: 15px;
    }

    .time-slots {
      color: #667eea;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .time-slot-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .slot-chip {
      background: #f0f0f0;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 0.85rem;
      color: #555;
    }

    .event-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-action {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }

    .btn-edit {
      background: #4299e1;
      color: white;
    }

    .btn-edit:hover {
      background: #3182ce;
    }

    .btn-preview {
      background: #48bb78;
      color: white;
    }

    .btn-preview:hover {
      background: #38a169;
    }

    .btn-delete {
      background: #f56565;
      color: white;
    }

    .btn-delete:hover {
      background: #e53e3e;
    }

    .empty-card {
      background: rgba(255, 255, 255, 0.1);
      border: 3px dashed rgba(255, 255, 255, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 250px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .empty-card:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: white;
      transform: translateY(-5px);
    }

    .empty-card-icon {
      font-size: 4rem;
      margin-bottom: 15px;
    }

    .empty-card-text {
      color: white;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-content {
      background: white;
      max-width: 700px;
      margin: 50px auto;
      border-radius: 15px;
      padding: 30px;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid #e2e8f0;
    }

    .modal-header h2 {
      color: #333;
      font-size: 1.8rem;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      color: #999;
      line-height: 1;
    }

    .close-btn:hover {
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .time-slots-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .modal-actions {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }

    .btn-save {
      flex: 1;
      background: #48bb78;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-save:hover {
      background: #38a169;
    }

    .btn-cancel {
      flex: 1;
      background: #cbd5e0;
      color: #333;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-cancel:hover {
      background: #a0aec0;
    }

    .alert {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 25px;
      border-radius: 8px;
      font-weight: 600;
      z-index: 2000;
      animation: slideIn 0.3s ease-out;
    }

    .alert-success {
      background: #c6f6d5;
      color: #22543d;
      border: 2px solid #48bb78;
    }

    .alert-error {
      background: #fed7d7;
      color: #742a2a;
      border: 2px solid #f56565;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.8rem;
      }

      .events-grid {
        grid-template-columns: 1fr;
      }

      .time-slots-grid {
        grid-template-columns: 1fr;
      }

      .header-actions {
        flex-direction: column;
      }

      .btn-header {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚙️ マルチイベント管理</h1>
      <p style="font-size: 1.1rem; opacity: 0.9;">備前丸予約システム - 最大5イベントまで管理可能</p>
      <div class="header-actions">
        <button class="btn-header" onclick="loadAllEvents()">🔄 全イベント再読込</button>
        <a href="dashboard-citizen.html" class="btn-header" target="_blank">📊 ダッシュボードを開く</a>
      </div>
    </div>

    <div class="events-grid" id="eventsGrid">
      <div style="text-align: center; color: white; padding: 40px; grid-column: 1 / -1;">
        📡 イベントデータを読み込んでいます...
      </div>
    </div>
  </div>

  <!-- 編集/作成モーダル -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">イベントを編集</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>

      <div class="form-group">
        <label>イベントタイトル</label>
        <input type="text" id="eventTitle" placeholder="例: 備前丸市民限定内覧会">
      </div>

      <div class="form-group">
        <label>イベント日付</label>
        <input type="text" id="eventDate" placeholder="例: 2026年3月15日">
      </div>

      <div class="form-group">
        <label>受付開始日時 ⭐NEW</label>
        <input type="datetime-local" id="acceptStart">
      </div>

      <div class="form-group">
        <label>受付終了日時 ⭐NEW</label>
        <input type="datetime-local" id="acceptEnd">
      </div>

      <div class="form-group">
        <label>公開ステータス ⭐NEW</label>
        <select id="publicStatus">
          <option value="公開">公開</option>
          <option value="非公開">非公開</option>
        </select>
      </div>

      <div class="form-group">
        <label>時間枠 (最大10枠)</label>
        <div class="time-slots-grid">
          <input type="text" id="slot1" placeholder="例: 09:00-09:30">
          <input type="text" id="slot2" placeholder="例: 09:30-10:00">
          <input type="text" id="slot3" placeholder="例: 10:00-10:30">
          <input type="text" id="slot4" placeholder="例: 10:30-11:00">
          <input type="text" id="slot5" placeholder="例: 11:00-11:30">
          <input type="text" id="slot6" placeholder="例: 11:30-12:00">
          <input type="text" id="slot7" placeholder="例: 13:00-13:30">
          <input type="text" id="slot8" placeholder="例: 13:30-14:00">
          <input type="text" id="slot9" placeholder="例: 14:00-14:30">
          <input type="text" id="slot10" placeholder="例: 14:30-15:00">
        </div>
      </div>

      <div class="form-group">
        <label>注意事項</label>
        <textarea id="eventNotes" placeholder="例: ※当日は受付で本人確認を行います。"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-save" onclick="saveEvent()">💾 保存</button>
        <button class="btn-cancel" onclick="closeModal()">❌ キャンセル</button>
      </div>

      <input type="hidden" id="currentEventNumber">
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLpyqMk8xbnNfDz5H2DHhH_ZLNBSEWDG2pI11zrnRkCFwf3uVvHgrYpr1Asi0ijA1n/exec';
    let allEventsData = [];

    // ページ読み込み時にイベントをロード
    window.addEventListener('DOMContentLoaded', loadAllEvents);

    async function loadAllEvents() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getEventSettings`);
        const data = await response.json();
        
        console.log('API Response:', data);
        
        if (data.success) {
          allEventsData = data.events || [];
          renderEventsGrid();
        } else {
          showAlert('データの読み込みに失敗しました', 'error');
        }
      } catch (error) {
        console.error('通信エラー:', error);
        showAlert(`通信エラー: ${error.message}`, 'error');
      }
    }

    function renderEventsGrid() {
      const grid = document.getElementById('eventsGrid');
      let html = '';

      console.log('=== レンダリング開始 ===');
      console.log('読み込まれたイベント数:', allEventsData.length);

      for (let i = 1; i <= 5; i++) {
        // イベント番号で検索 (複数のフィールド名に対応)
        const event = allEventsData.find(e => 
          e.eventNumber === i || 
          e['イベント番号'] === i ||
          (e['A列 (項目)'] && e['A列 (項目)'].includes(`イベント${i}`))
        );
        
        console.log(`イベント${i} 検索結果:`, event);
        
        // イベントが存在し、タイトルがある場合のみカード表示
        const hasTitle = event && (event['イベントタイトル'] || event.eventTitle);
        
        if (hasTitle) {
          console.log(`→ イベントカードを作成 (タイトル: ${event['イベントタイトル']})`);
          html += createEventCard({...event, eventNumber: i});
        } else {
          console.log(`→ 空カードを作成`);
          html += createEmptyCard(i);
        }
      }

      console.log('=== レンダリング完了 ===');
      grid.innerHTML = html;
    }

    function createEventCard(event) {
      // 公開ステータスを判定 (★NEW付きフィールドにも対応)
      const status = event['公開ステータス'] || event['公開ステータス ★NEW'] || '公開';
      const isPublic = (status === '公開');
      
      // バッジのスタイル
      const badgeClass = isPublic ? 'status-public' : 'status-private';
      const badgeText = isPublic ? '🟢 公開中' : '🔴 非公開';
      
      // デバッグ用ログ
      console.log(`イベント${event.eventNumber}: 公開ステータス="${status}" → 表示="${badgeText}"`);

      const timeSlots = [];
      for (let i = 1; i <= 10; i++) {
        const slotKey = `時間枠${i}`;
        if (event[slotKey]) {
          timeSlots.push(event[slotKey]);
        }
      }

      return `
        <div class="event-card">
          <div class="event-header">
            <h3>イベント ${event.eventNumber}</h3>
            <span class="status-badge ${badgeClass}">${badgeText}</span>
          </div>
          <h2>${event['イベントタイトル'] || '(タイトル未設定)'}</h2>
          <p class="event-date">📅 ${event['イベント日付'] || '(日付未設定)'}</p>
          <p class="time-slots">⏰ 時間枠 (${timeSlots.length}枠)</p>
          <div class="time-slot-preview">
            ${timeSlots.slice(0, 3).map(slot => `<span class="slot-chip">${slot}</span>`).join('')}
            ${timeSlots.length > 3 ? `<span class="slot-chip">他${timeSlots.length - 3}枠</span>` : ''}
          </div>
          <div class="event-actions">
            <button class="btn-action btn-edit" onclick="editEvent(${event.eventNumber})">✏️ 編集</button>
            <button class="btn-action btn-preview" onclick="previewEvent(${event.eventNumber})">👁️ プレビュー</button>
            <button class="btn-action btn-delete" onclick="confirmDeleteEvent(${event.eventNumber})">🗑️ 削除</button>
          </div>
        </div>
      `;
    }

    function createEmptyCard(eventNumber) {
      return `
        <div class="empty-card" onclick="createNewEvent(${eventNumber})">
          <div class="empty-card-icon">➕</div>
          <div class="empty-card-text">イベント ${eventNumber} を作成</div>
        </div>
      `;
    }

    function createNewEvent(eventNumber) {
      document.getElementById('modalTitle').textContent = `イベント ${eventNumber} を作成`;
      document.getElementById('currentEventNumber').value = eventNumber;
      
      // フォームをクリア
      document.getElementById('eventTitle').value = '';
      document.getElementById('eventDate').value = '';
      document.getElementById('acceptStart').value = '';
      document.getElementById('acceptEnd').value = '';
      document.getElementById('publicStatus').value = '公開';
      for (let i = 1; i <= 10; i++) {
        document.getElementById(`slot${i}`).value = '';
      }
      document.getElementById('eventNotes').value = '';
      
      document.getElementById('editModal').style.display = 'block';
    }

    function editEvent(eventNumber) {
      const event = allEventsData.find(e => 
        e.eventNumber === eventNumber || 
        e['イベント番号'] === eventNumber
      );
      
      if (!event) {
        showAlert(`イベント${eventNumber}が見つかりません`, 'error');
        return;
      }

      document.getElementById('modalTitle').textContent = `イベント ${eventNumber} を編集`;
      document.getElementById('currentEventNumber').value = eventNumber;
      
      document.getElementById('eventTitle').value = event['イベントタイトル'] || '';
      document.getElementById('eventDate').value = event['イベント日付'] || '';
      
      // 受付期間の読み込み (★NEW付きフィールドにも対応)
      const startTime = event['受付開始日時'] || event['受付開始日時 ★NEW'] || '';
      const endTime = event['受付終了日時'] || event['受付終了日時 ★NEW'] || '';
      const status = event['公開ステータス'] || event['公開ステータス ★NEW'] || '公開';
      
      document.getElementById('acceptStart').value = convertToDatetimeLocal(startTime);
      document.getElementById('acceptEnd').value = convertToDatetimeLocal(endTime);
      document.getElementById('publicStatus').value = status;
      
      for (let i = 1; i <= 10; i++) {
        document.getElementById(`slot${i}`).value = event[`時間枠${i}`] || '';
      }
      document.getElementById('eventNotes').value = event['注意事項'] || '';
      
      document.getElementById('editModal').style.display = 'block';
    }

    function convertToDatetimeLocal(dateStr) {
      if (!dateStr) return '';
      try {
        // "2026-02-15 9:00" → "2026-02-15T09:00"
        return dateStr.replace(' ', 'T').padStart(16, '0');
      } catch (e) {
        return '';
      }
    }

    async function saveEvent() {
      const eventNumber = parseInt(document.getElementById('currentEventNumber').value);
      const password = prompt('管理パスワードを入力してください:');
      
      if (!password) return;

      const settings = {
        'イベントタイトル': document.getElementById('eventTitle').value,
        'イベント日付': document.getElementById('eventDate').value,
        '受付開始日時': document.getElementById('acceptStart').value.replace('T', ' '),
        '受付終了日時': document.getElementById('acceptEnd').value.replace('T', ' '),
        '公開ステータス': document.getElementById('publicStatus').value,
        '注意事項': document.getElementById('eventNotes').value
      };

      for (let i = 1; i <= 10; i++) {
        const slotValue = document.getElementById(`slot${i}`).value;
        if (slotValue) {
          settings[`時間枠${i}`] = slotValue;
        }
      }

      try {
        const response = await fetch(`${SCRIPT_URL}?action=saveEventSettings`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `eventNumber=${eventNumber}&settings=${encodeURIComponent(JSON.stringify(settings))}&password=${encodeURIComponent(password)}`
        });

        const result = await response.json();
        
        if (result.success) {
          showAlert('保存しました!', 'success');
          closeModal();
          loadAllEvents();
        } else {
          showAlert(result.error || '保存に失敗しました', 'error');
        }
      } catch (error) {
        console.error('保存エラー:', error);
        showAlert(`保存エラー: ${error.message}`, 'error');
      }
    }

    function confirmDeleteEvent(eventNumber) {
      if (!confirm(`イベント ${eventNumber} を削除しますか?\nこの操作は取り消せません。`)) {
        return;
      }
      deleteEvent(eventNumber);
    }

    async function deleteEvent(eventNumber) {
      const password = prompt('管理パスワードを入力してください:');
      if (!password) return;

      try {
        const response = await fetch(`${SCRIPT_URL}?action=deleteEvent&eventNumber=${eventNumber}&password=${encodeURIComponent(password)}`);
        const result = await response.json();
        
        if (result.success) {
          showAlert('削除しました', 'success');
          loadAllEvents();
        } else {
          showAlert(result.error || '削除に失敗しました', 'error');
        }
      } catch (error) {
        console.error('削除エラー:', error);
        showAlert(`削除エラー: ${error.message}`, 'error');
      }
    }

    function previewEvent(eventNumber) {
      const event = allEventsData.find(e => 
        e.eventNumber === eventNumber || 
        e['イベント番号'] === eventNumber
      );
      
      if (!event) return;

      const previewWindow = window.open('', '_blank', 'width=800,height=600');
      previewWindow.document.write(`
        <!DOCTYPE html>
        <html lang="ja">
        <head>
          <meta charset="UTF-8">
          <title>プレビュー - ${event['イベントタイトル']}</title>
          <style>
            body { font-family: sans-serif; padding: 30px; max-width: 800px; margin: auto; }
            h1 { color: #667eea; }
            .info { background: #f7fafc; padding: 20px; border-radius: 10px; margin: 20px 0; }
            .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .slot { background: #e6f2ff; padding: 10px; border-radius: 5px; text-align: center; }
          </style>
        </head>
        <body>
          <h1>${event['イベントタイトル']}</h1>
          <div class="info">
            <p><strong>📅 日付:</strong> ${event['イベント日付']}</p>
            <p><strong>⏰ 時間枠:</strong></p>
            <div class="slots">
              ${Array.from({length: 10}, (_, i) => {
                const slot = event[`時間枠${i + 1}`];
                return slot ? `<div class="slot">${slot}</div>` : '';
              }).join('')}
            </div>
            <p style="margin-top: 20px;"><strong>📝 注意事項:</strong></p>
            <p>${event['注意事項'] || 'なし'}</p>
          </div>
        </body>
        </html>
      `);
    }

    function closeModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    function showAlert(message, type) {
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      document.body.appendChild(alert);

      setTimeout(() => {
        alert.remove();
      }, 3000);
    }

    // モーダル外クリックで閉じる
    window.onclick = function(event) {
      const modal = document.getElementById('editModal');
      if (event.target === modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>
