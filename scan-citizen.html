<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコードスキャン - 備前丸市民限定内覧会</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }
        
        /* 統計情報セクション */
        .stats-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .stat-card {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 10px;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }
        
        .scanner-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        #reader {
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #f5f5f5;
        }
        
        .result-container {
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            display: none;
        }
        
        .result-container.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .success {
            background: #d1fae5;
            border-left: 5px solid #10b981;
        }
        
        .error {
            background: #fee2e2;
            border-left: 5px solid #ef4444;
        }
        
        .info {
            background: #dbeafe;
            border-left: 5px solid #3b82f6;
        }
        
        .result-icon {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .result-title {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .ticket-info {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 10px;
        }
        
        .info-row {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            font-weight: 600;
            color: #667eea;
            min-width: 120px;
        }
        
        .info-value {
            color: #333;
            flex: 1;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.9;
        }
        
        .footer a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
            transition: background 0.3s;
        }
        
        .footer a:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚢 QRコードスキャン</h1>
            <p>備前丸市民限定内覧会</p>
        </div>
        
        <!-- 統計情報セクション -->
        <div class="stats-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalReservations">-</div>
                    <div class="stat-label">📋 総予約数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalBoarded">-</div>
                    <div class="stat-label">✅ 乗船済み</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalDisembarked">-</div>
                    <div class="stat-label">🏁 下船済み</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="currentOnboard">-</div>
                    <div class="stat-label">🚢 現在船内</div>
                </div>
            </div>
        </div>
        
        <div class="scanner-card">
            <div id="reader"></div>
            
            <div id="resultContainer" class="result-container">
                <div id="resultContent"></div>
            </div>
        </div>
        
        <div class="footer">
            <p>スタッフ専用画面</p>
            <a href="https://r7bzbizenyaki.github.io/bizen-maru-system/dashboard-citizen.html">📊 ダッシュボードへ</a>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLpyqMk8xbnNfDz5H2DHhH_ZLNBSEWDG2pI11zrnRkCFwf3uVvHgrYpr1Asi0ijA1n/exec';
        let html5QrcodeScanner;
        let isProcessing = false;
        
        // 統計情報を取得
        async function loadStats() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getDashboardData`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('totalReservations').textContent = data.stats.totalReservations || 0;
                    document.getElementById('totalBoarded').textContent = data.stats.totalBoarded || 0;
                    document.getElementById('totalDisembarked').textContent = data.stats.totalDisembarked || 0;
                    document.getElementById('currentOnboard').textContent = data.stats.currentOnboard || 0;
                }
            } catch (error) {
                console.error('統計情報の取得エラー:', error);
            }
        }
        
        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            
            isProcessing = true;
            html5QrcodeScanner.pause();
            
            processTicket(decodedText);
        }
        
        async function processTicket(ticketId) {
            const resultContainer = document.getElementById('resultContainer');
            const resultContent = document.getElementById('resultContent');
            
            resultContainer.className = 'result-container show';
            resultContent.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>チケット情報を確認中...</p>
                </div>
            `;
            
            try {
                // チケット情報を取得
                const ticketResponse = await fetch(`${SCRIPT_URL}?action=getTicketInfo&ticketId=${ticketId}`);
                const ticketData = await ticketResponse.json();
                
                if (!ticketData.success) {
                    showError('チケットが見つかりません', ticketData.message);
                    return;
                }
                
                const ticket = ticketData.ticket;
                
                // ステータスに応じて処理
                if (ticket.boardingStatus === '未乗船') {
                    await recordBoarding(ticketId, ticket);
                } else if (ticket.boardingStatus === '乗船済み') {
                    await recordDisembarking(ticketId, ticket);
                } else if (ticket.boardingStatus === '下船済み') {
                    showInfo('既に下船済みです', ticket);
                }
                
                // 統計情報を更新
                await loadStats();
                
            } catch (error) {
                console.error('Error:', error);
                showError('通信エラー', 'サーバーとの通信に失敗しました。');
            }
        }
        
        async function recordBoarding(ticketId, ticket) {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=recordBoarding&ticketId=${ticketId}`);
                const data = await response.json();
                
                if (data.success) {
                    showSuccess('乗船完了', ticket, '乗船');
                } else {
                    showError('エラー', data.message);
                }
            } catch (error) {
                showError('記録エラー', '乗船記録に失敗しました。');
            }
        }
        
        async function recordDisembarking(ticketId, ticket) {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=recordDisembarking&ticketId=${ticketId}`);
                const data = await response.json();
                
                if (data.success) {
                    showSuccess('下船完了', ticket, '下船');
                } else {
                    showError('エラー', data.message);
                }
            } catch (error) {
                showError('記録エラー', '下船記録に失敗しました。');
            }
        }
        
        function showSuccess(title, ticket, action) {
            const resultContent = document.getElementById('resultContent');
            resultContent.innerHTML = `
                <div class="result-icon">✅</div>
                <div class="result-title">${title}</div>
                <div class="ticket-info">
                    <div class="info-row">
                        <span class="info-label">お名前</span>
                        <span class="info-value">${ticket.name} 様</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">予約日</span>
                        <span class="info-value">${ticket.date}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">時間枠</span>
                        <span class="info-value">${ticket.timeSlot}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">処理</span>
                        <span class="info-value">${action}記録完了</span>
                    </div>
                </div>
                <button class="btn" onclick="resetScanner()">次のスキャンへ</button>
            `;
        }
        
        function showError(title, message) {
            const resultContainer = document.getElementById('resultContainer');
            const resultContent = document.getElementById('resultContent');
            
            resultContainer.className = 'result-container show error';
            resultContent.innerHTML = `
                <div class="result-icon">❌</div>
                <div class="result-title">${title}</div>
                <p style="text-align:center; margin-top:10px; color:#666;">${message}</p>
                <button class="btn" onclick="resetScanner()">もう一度スキャン</button>
            `;
        }
        
        function showInfo(title, ticket) {
            const resultContainer = document.getElementById('resultContainer');
            const resultContent = document.getElementById('resultContent');
            
            resultContainer.className = 'result-container show info';
            resultContent.innerHTML = `
                <div class="result-icon">ℹ️</div>
                <div class="result-title">${title}</div>
                <div class="ticket-info">
                    <div class="info-row">
                        <span class="info-label">お名前</span>
                        <span class="info-value">${ticket.name} 様</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">予約日</span>
                        <span class="info-value">${ticket.date}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">ステータス</span>
                        <span class="info-value">${ticket.boardingStatus}</span>
                    </div>
                </div>
                <button class="btn" onclick="resetScanner()">次のスキャンへ</button>
            `;
        }
        
        function resetScanner() {
            document.getElementById('resultContainer').className = 'result-container';
            isProcessing = false;
            html5QrcodeScanner.resume();
        }
        
        function startScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader",
                { 
                    fps: 10,
                    qrbox: { width: 250, height: 250 },
                    aspectRatio: 1.0
                },
                false
            );
            
            html5QrcodeScanner.render(onScanSuccess);
        }
        
        // ページ読み込み時に初期化
        window.addEventListener('DOMContentLoaded', () => {
            startScanner();
            loadStats();
            
            // 30秒ごとに統計を更新
            setInterval(loadStats, 30000);
        });
    </script>
</body>
</html>
