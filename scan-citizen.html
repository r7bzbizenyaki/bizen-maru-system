<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコードスキャン - 備前丸市民限定内覧会</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }
        
        .container { max-width: 600px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px 15px 0 0;
            text-align: center;
        }
        
        .header h1 { font-size: 22px; margin-bottom: 5px; }
        .header p { font-size: 13px; opacity: 0.9; }
        
        .debug-panel {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .debug-panel h4 { margin-bottom: 5px; color: #856404; }
        .debug-log { color: #856404; font-family: monospace; line-height: 1.4; }
        
        .mode-selector {
            background: white;
            padding: 20px;
            display: flex;
            gap: 10px;
        }
        
        .mode-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        
        .scanner-section { background: white; padding: 20px; }
        
        .camera-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .camera-btn:active { transform: scale(0.98); }
        .camera-btn.stop { background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%); }
        
        #reader {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }
        
        #reader video {
            width: 100% !important;
            height: auto !important;
            border-radius: 10px;
        }
        
        .manual-input { background: white; padding: 20px; border-radius: 0 0 15px 15px; }
        .manual-input h3 { font-size: 16px; color: #667eea; margin-bottom: 15px; }
        
        .input-group { display: flex; gap: 10px; }
        
        .input-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .input-group button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .status-message {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .stats-section {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 15px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-label { font-size: 12px; color: #666; margin-bottom: 5px; }
        .stat-value { font-size: 24px; font-weight: bold; color: #667eea; }

        .permission-help {
            background: #e3f2fd;
            border: 2px solid #2196f3;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            display: none;
        }

        .permission-help h4 { color: #1565c0; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 QRコードスキャン</h1>
            <p>備前丸市民限定内覧会</p>
        </div>
        
        <div class="debug-panel">
            <h4>🔍 スキャンログ</h4>
            <div class="debug-log" id="debugLog">システム初期化中...</div>
        </div>

        <div id="permissionHelp" class="permission-help">
            <h4>📱 カメラ権限の設定方法</h4>
            <strong>iPhone Safari:</strong><br>
            1. URLバー左の「ぁあ」→「Webサイトの設定」→「カメラ」→「許可」<br>
            2. または 設定→Safari→カメラ→「許可」<br><br>
            <strong>Android Chrome:</strong><br>
            1. URLバー左の鍵マーク→「権限」→「カメラ」→「許可」<br>
            2. または 設定→サイトの設定→カメラ→「許可」
        </div>
        
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="boarding" onclick="setMode('boarding')">
                🚢 乗船
            </button>
            <button class="mode-btn" data-mode="alighting" onclick="setMode('alighting')">
                ⚓ 下船
            </button>
        </div>
        
        <div class="scanner-section">
            <button id="startBtn" class="camera-btn" onclick="toggleCamera()">
                📷 QRコードスキャンを開始
            </button>
            
            <div id="reader"></div>
            
            <div id="statusMessage" class="status-message"></div>
        </div>
        
        <div class="manual-input">
            <h3>🔢 手動入力</h3>
            <div class="input-group">
                <input type="text" id="manualInput" placeholder="チケットID (例: CM1234567890)">
                <button onclick="recordManual()">記録</button>
            </div>
        </div>
        
        <div class="stats-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">総乗船数</div>
                    <div class="stat-value" id="totalBoarding">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">総下船数</div>
                    <div class="stat-value" id="totalAlighting">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">現在船内</div>
                    <div class="stat-value" id="currentOnboard">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">平均滞在</div>
                    <div class="stat-value" id="avgStay">-</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLpyqMk8xbnNfDz5H2DHhH_ZLNBSEWDG2pI11zrnRkCFwf3uVvHgrYpr1Asi0ijA1n/exec';
        
        let currentMode = 'boarding';
        let html5QrCode = null;
        let isScanning = false;
        let lastScannedCode = null;
        let lastScanTime = 0;
        
        const debugLog = (message) => {
            const time = new Date().toLocaleTimeString('ja-JP');
            const log = document.getElementById('debugLog');
            log.innerHTML = `[${time}] ${message}<br>` + log.innerHTML;
            console.log(`[${time}] ${message}`);
        };
        
        debugLog('システム初期化完了');
        
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
            debugLog(`モード切替: ${mode === 'boarding' ? '乗船' : '下船'}`);
        }
        
        async function toggleCamera() {
            if (isScanning) {
                await stopCamera();
            } else {
                await startCamera();
            }
        }
        
        async function startCamera() {
            debugLog('カメラ起動開始...');
            document.getElementById('permissionHelp').style.display = 'none';
            
            try {
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                    debugLog('Html5Qrcodeインスタンス作成');
                }
                
                const config = {
                    fps: 10,
                    qrbox: { width: 250, height: 250 },
                    aspectRatio: 1.0
                };
                
                await html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    onScanSuccess,
                    onScanFailure
                );
                
                isScanning = true;
                document.getElementById('reader').style.display = 'block';
                document.getElementById('startBtn').textContent = '⏹️ スキャンを停止';
                document.getElementById('startBtn').classList.add('stop');
                
                debugLog('カメラ起動成功 - スキャン待機中');
                
            } catch (err) {
                debugLog(`カメラ起動エラー: ${err.name || 'Unknown'} - ${err.message || err}`);
                
                if (err.name === 'NotAllowedError' || err.message?.includes('Permission denied')) {
                    document.getElementById('permissionHelp').style.display = 'block';
                    showMessage('カメラ権限が拒否されています。上記の手順で許可してください。', 'error');
                } else {
                    showMessage(`カメラエラー: ${err.message || err}`, 'error');
                }
            }
        }
        
        async function stopCamera() {
            debugLog('カメラ停止処理開始...');
            
            try {
                if (html5QrCode && isScanning) {
                    await html5QrCode.stop();
                    debugLog('カメラ停止成功');
                }
            } catch (err) {
                debugLog(`停止エラー: ${err.message || err}`);
            } finally {
                isScanning = false;
                document.getElementById('reader').style.display = 'none';
                document.getElementById('startBtn').textContent = '📷 QRコードスキャンを開始';
                document.getElementById('startBtn').classList.remove('stop');
            }
        }
        
        function onScanSuccess(decodedText, decodedResult) {
            const now = Date.now();
            if (decodedText === lastScannedCode && (now - lastScanTime) < 2000) {
                return;
            }
            
            lastScannedCode = decodedText;
            lastScanTime = now;
            
            debugLog(`QR検出: ${decodedText}`);
            processTicket(decodedText);
        }
        
        function onScanFailure(error) {
            // スキャン失敗は正常
        }
        
        async function processTicket(ticketId) {
            debugLog(`チケット処理開始: ${ticketId}`);
            
            try {
                const action = currentMode === 'boarding' ? 'recordBoarding' : 'recordDisembarking';
                const url = `${SCRIPT_URL}?action=${action}&ticketId=${encodeURIComponent(ticketId)}`;
                
                const response = await fetch(url);
                const result = await response.json();
                
                if (result.success) {
                    const modeName = currentMode === 'boarding' ? '乗船' : '下船';
                    debugLog(`✅ ${modeName}記録成功: ${ticketId}`);
                    showMessage(`✅ ${modeName}を記録しました`, 'success');
                    
                    playBeep();
                    if (navigator.vibrate) navigator.vibrate(200);
                    
                    updateStats();
                } else {
                    debugLog(`❌ 記録エラー: ${result.error || 'Unknown'}`);
                    showMessage(`❌ ${result.error || 'エラーが発生しました'}`, 'error');
                }
            } catch (err) {
                debugLog(`❌ 通信エラー: ${err.message || err}`);
                showMessage('❌ 通信エラーが発生しました', 'error');
            }
        }
        
        function recordManual() {
            const input = document.getElementById('manualInput');
            const ticketId = input.value.trim();
            
            if (!ticketId) {
                showMessage('チケットIDを入力してください', 'error');
                return;
            }
            
            debugLog(`手動入力: ${ticketId}`);
            processTicket(ticketId);
            input.value = '';
        }
        
        function showMessage(message, type) {
            const msgEl = document.getElementById('statusMessage');
            msgEl.textContent = message;
            msgEl.className = `status-message ${type}`;
            msgEl.style.display = 'block';
            
            setTimeout(() => {
                msgEl.style.display = 'none';
            }, 3000);
        }
        
        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 800;
                gain.gain.value = 0.3;
                osc.start();
                osc.stop(ctx.currentTime + 0.2);
            } catch (e) {}
        }
        
        async function updateStats() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getStats`);
                const stats = await res.json();
                
                if (stats.success) {
                    document.getElementById('totalBoarding').textContent = stats.boarding || 0;
                    document.getElementById('totalAlighting').textContent = stats.alighting || 0;
                    document.getElementById('currentOnboard').textContent = (stats.boarding || 0) - (stats.alighting || 0);
                }
            } catch (e) {}
        }
        
        updateStats();
        setInterval(updateStats, 10000);
    </script>
</body>
</html>
