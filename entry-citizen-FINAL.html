<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>備前丸 市民限定内覧会 - 予約フォーム FINAL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Yu Gothic', 'Meiryo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 3px solid #667eea;
        }

        .header h1 {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .status-bar {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .section-title {
            font-size: 1.3em;
            color: #667eea;
            margin: 30px 0 20px 0;
            padding-left: 15px;
            border-left: 5px solid #667eea;
        }

        .date-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .date-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            border: 3px solid transparent;
        }

        .date-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .date-card.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .date-card .date {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .date-card .weekday {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .date-card .label {
            margin-top: 10px;
            font-size: 0.85em;
            padding: 5px 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
        }

        .time-slots {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .time-slot {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .time-slot:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .time-slot.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 1.1em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px;
            color: #667eea;
            font-size: 1.2em;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 5px solid #c33;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 5px solid #3c3;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .date-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚢 備前丸 市民限定内覧会</h1>
            <p>予約フォーム</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot"></div>
                <span id="cloud-status">クラウド接続確認中...</span>
            </div>
            <div class="status-item">
                📊 総予約数: <strong id="total-reservations">-</strong>件
            </div>
        </div>

        <form id="reservation-form">
            <div class="section-title">📅 希望日を選択</div>
            <div class="date-cards" id="date-cards"></div>

            <div class="section-title">🕐 希望時間を選択</div>
            <div class="time-slots" id="time-slots"></div>

            <div class="section-title">👤 お客様情報</div>

            <div class="form-group">
                <label for="name">氏名 <span style="color: red;">*</span></label>
                <input type="text" id="name" name="name" required placeholder="山田 太郎">
            </div>

            <div class="form-group">
                <label for="postal">郵便番号 <span style="color: red;">*</span></label>
                <input type="text" id="postal" name="postal" required placeholder="705-0001" maxlength="8">
                <small style="color: #666;">ハイフンあり・なしどちらでもOK</small>
            </div>

            <div class="form-group">
                <label for="address">住所 <span style="color: red;">*</span></label>
                <input type="text" id="address" name="address" required placeholder="岡山県備前市...">
            </div>

            <div class="form-group">
                <label for="phone">電話番号 <span style="color: red;">*</span></label>
                <input type="tel" id="phone" name="phone" required placeholder="090-1234-5678">
            </div>

            <div class="form-group">
                <label for="email">メールアドレス <span style="color: red;">*</span></label>
                <input type="email" id="email" name="email" required placeholder="example@example.com">
            </div>

            <button type="submit" class="submit-btn">予約を送信</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>予約を送信中...</p>
        </div>

        <div id="message"></div>
    </div>

    <script>
        // 🔗 Google Apps Script の URL（doPost 用）
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzGMnX44c_d12wV93FaY0xV5L9bBbX9NNo_VJGzzWTcWOzvdlxdK_GoPXqd_OrwWCQM/exec';

        // 📅 イベント日程
        const EVENT_DATES = [
            { date: '2026-02-27', weekday: '木曜日', label: '初日' },
            { date: '2026-03-27', weekday: '金曜日', label: '2日目' },
            { date: '2026-03-28', weekday: '土曜日', label: '最終日' }
        ];

        // 🕐 時間帯
        const TIME_SLOTS = [
            '10:00 - 11:00',
            '11:00 - 12:00',
            '13:00 - 14:00',
            '14:00 - 15:00',
            '15:00 - 16:00'
        ];

        let selectedDate = '';
        let selectedTime = '';

        // 初期化
        window.addEventListener('DOMContentLoaded', () => {
            checkCloudConnection();
            renderDateCards();
            renderTimeSlots();
            setupPostalCodeLookup();
            setupPhoneFormat();
            setupFormSubmit();
        });

        // クラウド接続確認
        async function checkCloudConnection() {
            try {
                const response = await fetch(`${GAS_URL}?action=ping`);
                const data = await response.json();
                if (data.success) {
                    document.getElementById('cloud-status').textContent = '🟢 オンライン';
                    loadReservations();
                }
            } catch (error) {
                document.getElementById('cloud-status').textContent = '🔴 オフライン';
                console.error('クラウド接続エラー:', error);
            }
        }

        // 予約データ読み込み
        async function loadReservations() {
            try {
                const response = await fetch(`${GAS_URL}?action=getAllCitizenV2`);
                const data = await response.json();
                if (data.success) {
                    document.getElementById('total-reservations').textContent = data.totalCitizen || 0;
                    updateDateCards(data.data || []);
                }
            } catch (error) {
                console.error('予約データ読み込みエラー:', error);
            }
        }

        // 日付カード描画
        function renderDateCards() {
            const container = document.getElementById('date-cards');
            container.innerHTML = EVENT_DATES.map(event => `
                <div class="date-card" data-date="${event.date}">
                    <div class="date">${event.date.substring(5).replace('-', '/')}</div>
                    <div class="weekday">${event.weekday}</div>
                    <div class="label">${event.label}</div>
                    <div class="count" style="margin-top: 10px; font-size: 0.9em;">予約: <strong>0</strong>件</div>
                </div>
            `).join('');

            // クリックイベント
            document.querySelectorAll('.date-card').forEach(card => {
                card.addEventListener('click', () => {
                    document.querySelectorAll('.date-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedDate = card.dataset.date;
                });
            });
        }

        // 時間帯描画
        function renderTimeSlots() {
            const container = document.getElementById('time-slots');
            container.innerHTML = TIME_SLOTS.map(time => `
                <div class="time-slot" data-time="${time}">${time}</div>
            `).join('');

            document.querySelectorAll('.time-slot').forEach(slot => {
                slot.addEventListener('click', () => {
                    document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
                    slot.classList.add('selected');
                    selectedTime = slot.dataset.time;
                });
            });
        }

        // 日付カードに予約数を反映
        function updateDateCards(reservations) {
            const counts = {};
            reservations.forEach(r => {
                counts[r.date] = (counts[r.date] || 0) + 1;
            });

            document.querySelectorAll('.date-card').forEach(card => {
                const date = card.dataset.date;
                const count = counts[date] || 0;
                card.querySelector('.count strong').textContent = count;
            });
        }

        // 郵便番号自動入力
        function setupPostalCodeLookup() {
            const postalInput = document.getElementById('postal');
            const addressInput = document.getElementById('address');

            postalInput.addEventListener('blur', async () => {
                const postal = postalInput.value.replace(/[^0-9]/g, '');
                if (postal.length === 7) {
                    try {
                        const response = await fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${postal}`);
                        const data = await response.json();
                        if (data.results) {
                            const result = data.results[0];
                            addressInput.value = `${result.address1}${result.address2}${result.address3}`;
                        }
                    } catch (error) {
                        console.error('郵便番号検索エラー:', error);
                    }
                }
            });
        }

        // 電話番号自動フォーマット
        function setupPhoneFormat() {
            const phoneInput = document.getElementById('phone');
            phoneInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/[^0-9]/g, '');
                if (value.length > 11) value = value.substring(0, 11);
                
                if (value.length >= 7) {
                    value = value.replace(/^(\d{3})(\d{4})(\d+)$/, '$1-$2-$3');
                } else if (value.length >= 4) {
                    value = value.replace(/^(\d{3})(\d+)$/, '$1-$2');
                }
                
                e.target.value = value;
            });
        }

        // フォーム送信処理（POST メソッドに変更）
        function setupFormSubmit() {
            const form = document.getElementById('reservation-form');
            const loading = document.getElementById('loading');
            const messageDiv = document.getElementById('message');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                // バリデーション
                if (!selectedDate) {
                    messageDiv.innerHTML = '<div class="error">日付を選択してください</div>';
                    return;
                }
                if (!selectedTime) {
                    messageDiv.innerHTML = '<div class="error">時間を選択してください</div>';
                    return;
                }

                // フォームデータ収集
                const formData = {
                    category: 'citizen',
                    date: selectedDate,
                    time: selectedTime,
                    name: document.getElementById('name').value,
                    postal: document.getElementById('postal').value,
                    address: document.getElementById('address').value,
                    phone: document.getElementById('phone').value,
                    email: document.getElementById('email').value
                };

                // 送信処理
                form.style.display = 'none';
                loading.style.display = 'block';
                messageDiv.innerHTML = '';

                try {
                    // 🔧 POST メソッドで送信
                    const response = await fetch(GAS_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(formData)
                    });

                    const data = await response.json();

                    if (data.success) {
                        messageDiv.innerHTML = `
                            <div class="success">
                                <h3>✅ 予約が完了しました！</h3>
                                <p>チケットID: <strong>${data.ticketId}</strong></p>
                                <p>当日はこのチケットIDをご提示ください。</p>
                            </div>
                        `;
                        form.reset();
                        selectedDate = '';
                        selectedTime = '';
                        document.querySelectorAll('.date-card, .time-slot').forEach(el => el.classList.remove('selected'));
                        loadReservations(); // 予約数を更新
                    } else {
                        throw new Error(data.message || '予約の送信に失敗しました');
                    }
                } catch (error) {
                    messageDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ エラーが発生しました</h3>
                            <p>${error.message}</p>
                            <p>もう一度お試しください。</p>
                        </div>
                    `;
                } finally {
                    loading.style.display = 'none';
                    form.style.display = 'block';
                }
            });
        }
    </script>
</body>
</html>
