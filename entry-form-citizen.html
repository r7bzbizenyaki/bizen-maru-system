<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>備前丸市民限定内覧会 予約フォーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1rem;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .required {
            color: #ef4444;
            margin-left: 5px;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .time-slots {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .time-slot {
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .time-slot:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .time-slot.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
        }
        
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* ローディング画面 */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        
        .loading-overlay.show {
            display: flex;
        }
        
        .loading-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .loading-subtext {
            font-size: 0.9rem;
            color: #666;
        }
        
        .note {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ffc107;
        }
        
        .note p {
            color: #856404;
            font-size: 0.9rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚢 備前丸市民限定内覧会</h1>
            <p>予約フォーム</p>
        </div>
        
        <div class="note">
            <p>📌 予約完了後、確認メールが送信されます。<br>
            当日はメールに記載されたQRコードをご提示ください。</p>
        </div>
        
        <form id="reservationForm">
            <div class="form-group">
                <label>📅 ご希望の日付 <span class="required">※</span></label>
                <input type="date" id="date" name="date" required>
            </div>
            
            <div class="form-group">
                <label>⏰ ご希望の時間枠 <span class="required">※</span></label>
                <div class="time-slots" id="timeSlots">
                    <div class="time-slot" data-time="09:00-09:30">09:00-09:30</div>
                    <div class="time-slot" data-time="09:30-10:00">09:30-10:00</div>
                    <div class="time-slot" data-time="10:00-10:30">10:00-10:30</div>
                    <div class="time-slot" data-time="10:30-11:00">10:30-11:00</div>
                    <div class="time-slot" data-time="11:00-11:30">11:00-11:30</div>
                    <div class="time-slot" data-time="11:30-12:00">11:30-12:00</div>
                    <div class="time-slot" data-time="13:00-13:30">13:00-13:30</div>
                    <div class="time-slot" data-time="13:30-14:00">13:30-14:00</div>
                    <div class="time-slot" data-time="14:00-14:30">14:00-14:30</div>
                    <div class="time-slot" data-time="14:30-15:00">14:30-15:00</div>
                </div>
                <input type="hidden" id="timeSlot" name="timeSlot" required>
            </div>
            
            <div class="form-group">
                <label>👤 お名前 <span class="required">※</span></label>
                <input type="text" id="name" name="name" placeholder="山田 太郎" required>
            </div>
            
            <div class="form-group">
                <label>🎂 年齢 <span class="required">※</span></label>
                <input type="number" id="age" name="age" min="0" max="120" placeholder="30" required>
            </div>
            
            <div class="form-group">
                <label>👥 性別 <span class="required">※</span></label>
                <select id="gender" name="gender" required>
                    <option value="">選択してください</option>
                    <option value="男性">男性</option>
                    <option value="女性">女性</option>
                    <option value="その他">その他</option>
                    <option value="回答しない">回答しない</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>📮 郵便番号 <span class="required">※</span></label>
                <input type="text" id="postalCode" name="postalCode" placeholder="700-0000" required>
            </div>
            
            <div class="form-group">
                <label>🏠 住所 <span class="required">※</span></label>
                <input type="text" id="address" name="address" placeholder="岡山県備前市..." required>
            </div>
            
            <div class="form-group">
                <label>📞 電話番号 <span class="required">※</span></label>
                <input type="tel" id="phone" name="phone" placeholder="090-1234-5678" required>
            </div>
            
            <div class="form-group">
                <label>📧 メールアドレス <span class="required">※</span></label>
                <input type="email" id="email" name="email" placeholder="example@example.com" required>
            </div>
            
            <button type="submit" class="btn-submit">予約を確定する</button>
        </form>
    </div>
    
    <!-- ローディング画面 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">予約を処理中...</div>
            <div class="loading-subtext" id="loadingSubtext">しばらくお待ちください</div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLpyqMk8xbnNfDz5H2DHhH_ZLNBSEWDG2pI11zrnRkCFwf3uVvHgrYpr1Asi0ijA1n/exec';
        
        // 時間枠選択
        const timeSlots = document.querySelectorAll('.time-slot');
        const timeSlotInput = document.getElementById('timeSlot');
        
        timeSlots.forEach(slot => {
            slot.addEventListener('click', () => {
                timeSlots.forEach(s => s.classList.remove('selected'));
                slot.classList.add('selected');
                timeSlotInput.value = slot.dataset.time;
            });
        });
        
        // フォーム送信
        document.getElementById('reservationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // バリデーション
            if (!timeSlotInput.value) {
                alert('時間枠を選択してください');
                return;
            }
            
            // フォームデータを取得
            const formData = {
                category: '市民',
                date: document.getElementById('date').value,
                timeSlot: timeSlotInput.value,
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                postalCode: document.getElementById('postalCode').value,
                address: document.getElementById('address').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value
            };
            
            // 確認ダイアログ
            const confirmed = confirm(`以下の内容で予約します。よろしいですか？\n\n` +
                `お名前: ${formData.name}\n` +
                `日付: ${formData.date}\n` +
                `時間枠: ${formData.timeSlot}\n` +
                `性別: ${formData.gender}\n` +
                `年齢: ${formData.age}\n` +
                `電話番号: ${formData.phone}\n` +
                `メールアドレス: ${formData.email}`
            );
            
            if (!confirmed) return;
            
            // ローディング表示
            showLoading('予約を処理中...', 'スプレッドシートに保存しています');
            
            try {
                // URLSearchParams を使用してフォームデータを送信
                const params = new URLSearchParams(formData);
                
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: params,
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // 成功: メール送信を待つ
                    updateLoading('メール送信中...', '確認メールを送信しています');
                    
                    // さらに2秒待機（メール送信完了を確実にする）
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    
                    // チケットページへリダイレクト
                    updateLoading('完了！', 'チケット画面を表示します');
                    
                    setTimeout(() => {
                        window.location.href = `ticket-citizen.html?id=${data.ticketId}`;
                    }, 1000);
                    
                } else {
                    hideLoading();
                    alert('予約に失敗しました:\n' + (data.message || '不明なエラー'));
                }
                
            } catch (error) {
                hideLoading();
                console.error('Error:', error);
                alert('通信エラーが発生しました。\nもう一度お試しください。\n\nエラー内容: ' + error.message);
            }
        });
        
        function showLoading(text, subtext) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingSubtext').textContent = subtext;
            document.getElementById('loadingOverlay').classList.add('show');
        }
        
        function updateLoading(text, subtext) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingSubtext').textContent = subtext;
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('show');
        }
        
        // 日付の初期値を明日に設定
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('date').valueAsDate = tomorrow;
        
        // 日付の最小値を今日に設定
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').setAttribute('min', today);
    </script>
</body>
</html>
