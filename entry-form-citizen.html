<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>備前丸市民限定内覧会 予約フォーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1rem;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        
        .required {
            color: #ef4444;
            margin-left: 5px;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        /* 日付ボタン */
        .date-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }
        
        .date-button {
            padding: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }
        
        .date-button:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }
        
        .date-button.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .date-button .date-weekday {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .date-button .date-info {
            font-size: 0.85rem;
            opacity: 0.8;
        }
        
        .date-button.selected .date-info {
            opacity: 1;
        }
        
        /* 時間枠ボタン */
        .time-slots {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .time-slot {
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .time-slot:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .time-slot.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .btn-submit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 30px;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* ローディング画面 */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        
        .loading-overlay.show {
            display: flex;
        }
        
        .loading-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .loading-subtext {
            font-size: 0.9rem;
            color: #666;
        }
        
        .note {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ffc107;
        }
        
        .note p {
            color: #856404;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .date-buttons {
                grid-template-columns: 1fr;
            }
            
            .time-slots {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚢 備前丸市民限定内覧会</h1>
            <p>予約フォーム</p>
        </div>
        
        <div class="note">
            <p>📌 予約完了後、確認メールが送信されます。<br>
            当日はメールに記載されたQRコードをご提示ください。</p>
        </div>
        
        <form id="reservationForm">
            <div class="form-group">
                <label>📅 ご希望の日付を選択してください <span class="required">※</span></label>
                <div class="date-buttons" id="dateButtons">
                    <!-- JavaScriptで動的に生成 -->
                </div>
                <input type="hidden" id="date" name="date" required>
            </div>
            
            <div class="form-group">
                <label>⏰ ご希望の時間枠を選択してください <span class="required">※</span></label>
                <div class="time-slots" id="timeSlots">
                    <div class="time-slot" data-time="09:00-09:30">09:00-09:30</div>
                    <div class="time-slot" data-time="09:30-10:00">09:30-10:00</div>
                    <div class="time-slot" data-time="10:00-10:30">10:00-10:30</div>
                    <div class="time-slot" data-time="10:30-11:00">10:30-11:00</div>
                    <div class="time-slot" data-time="11:00-11:30">11:00-11:30</div>
                    <div class="time-slot" data-time="11:30-12:00">11:30-12:00</div>
                    <div class="time-slot" data-time="13:00-13:30">13:00-13:30</div>
                    <div class="time-slot" data-time="13:30-14:00">13:30-14:00</div>
                    <div class="time-slot" data-time="14:00-14:30">14:00-14:30</div>
                    <div class="time-slot" data-time="14:30-15:00">14:30-15:00</div>
                </div>
                <input type="hidden" id="timeSlot" name="timeSlot" required>
            </div>
            
            <div class="form-group">
                <label>👤 お名前 <span class="required">※</span></label>
                <input type="text" id="name" name="name" placeholder="山田 太郎" required>
            </div>
            
            <div class="form-group">
                <label>🎂 年齢 <span class="required">※</span></label>
                <input type="number" id="age" name="age" min="0" max="120" placeholder="30" required>
            </div>
            
            <div class="form-group">
                <label>👥 性別 <span class="required">※</span></label>
                <select id="gender" name="gender" required>
                    <option value="">選択してください</option>
                    <option value="男性">男性</option>
                    <option value="女性">女性</option>
                    <option value="その他">その他</option>
                    <option value="回答しない">回答しない</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>📮 郵便番号 <span class="required">※</span></label>
                <input type="text" id="postalCode" name="postalCode" placeholder="700-0000" required>
            </div>
            
            <div class="form-group">
                <label>🏠 住所 <span class="required">※</span></label>
                <input type="text" id="address" name="address" placeholder="岡山県備前市..." required>
            </div>
            
            <div class="form-group">
                <label>📞 電話番号 <span class="required">※</span></label>
                <input type="tel" id="phone" name="phone" placeholder="090-1234-5678" required>
            </div>
            
            <div class="form-group">
                <label>📧 メールアドレス <span class="required">※</span></label>
                <input type="email" id="email" name="email" placeholder="example@example.com" required>
            </div>
            
            <button type="submit" class="btn-submit">予約を確定する</button>
        </form>
    </div>
    
    <!-- ローディング画面 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">予約を処理中...</div>
            <div class="loading-subtext" id="loadingSubtext">しばらくお待ちください</div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLpyqMk8xbnNfDz5H2DHhH_ZLNBSEWDG2pI11zrnRkCFwf3uVvHgrYpr1Asi0ijA1n/exec';
        
        // 日付ボタンを生成（今日から30日分）
        function generateDateButtons() {
            const dateButtonsContainer = document.getElementById('dateButtons');
            const today = new Date();
            
            for (let i = 0; i < 30; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);
                
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const dateString = `${year}-${month}-${day}`;
                
                const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
                const weekday = weekdays[date.getDay()];
                
                const button = document.createElement('div');
                button.className = 'date-button';
                button.dataset.date = dateString;
                button.innerHTML = `
                    <div class="date-weekday">${month}月${day}日（${weekday}）</div>
                    <div class="date-info">0件予約</div>
                `;
                
                button.addEventListener('click', () => {
                    document.querySelectorAll('.date-button').forEach(btn => {
                        btn.classList.remove('selected');
                    });
                    button.classList.add('selected');
                    document.getElementById('date').value = dateString;
                });
                
                dateButtonsContainer.appendChild(button);
            }
        }
        
        // 時間枠選択
        const timeSlots = document.querySelectorAll('.time-slot');
        const timeSlotInput = document.getElementById('timeSlot');
        
        timeSlots.forEach(slot => {
            slot.addEventListener('click', () => {
                timeSlots.forEach(s => s.classList.remove('selected'));
                slot.classList.add('selected');
                timeSlotInput.value = slot.dataset.time;
            });
        });
        
        // フォーム送信
        document.getElementById('reservationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // バリデーション
            const dateInput = document.getElementById('date');
            if (!dateInput.value) {
                alert('日付を選択してください');
                return;
            }
            
            if (!timeSlotInput.value) {
                alert('時間枠を選択してください');
                return;
            }
            
            // フォームデータを取得
            const formData = {
                category: '市民',
                date: dateInput.value,
                timeSlot: timeSlotInput.value,
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                postalCode: document.getElementById('postalCode').value,
                address: document.getElementById('address').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value
            };
            
            // 確認ダイアログ
            const confirmed = confirm(`以下の内容で予約します。よろしいですか？\n\n` +
                `お名前: ${formData.name}\n` +
                `日付: ${formData.date}\n` +
                `時間枠: ${formData.timeSlot}\n` +
                `性別: ${formData.gender}\n` +
                `年齢: ${formData.age}\n` +
                `電話番号: ${formData.phone}\n` +
                `メールアドレス: ${formData.email}`
            );
            
            if (!confirmed) return;
            
            // ローディング表示
            showLoading('予約を処理中...', 'スプレッドシートに保存しています');
            
            try {
                const params = new URLSearchParams(formData);
                
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: params,
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    updateLoading('メール送信中...', '確認メールを送信しています');
                    
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    
                    updateLoading('完了！', 'チケット画面を表示します');
                    
                    setTimeout(() => {
                        window.location.href = `ticket-citizen.html?id=${data.ticketId}`;
                    }, 1000);
                    
                } else {
                    hideLoading();
                    alert('予約に失敗しました:\n' + (data.message || '不明なエラー'));
                }
                
            } catch (error) {
                hideLoading();
                console.error('Error:', error);
                alert('通信エラーが発生しました。\nもう一度お試しください。\n\nエラー内容: ' + error.message);
            }
        });
        
        function showLoading(text, subtext) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingSubtext').textContent = subtext;
            document.getElementById('loadingOverlay').classList.add('show');
        }
        
        function updateLoading(text, subtext) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingSubtext').textContent = subtext;
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('show');
        }
        
        // 初期化
        window.addEventListener('DOMContentLoaded', () => {
            generateDateButtons();
        });
    </script>
</body>
</html>
