<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>備前丸市民限定内覧会 予約フォーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .section-title {
            display: flex;
            align-items: center;
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            margin: 25px 0 15px 0;
        }
        
        .section-title .icon {
            font-size: 1.5rem;
            margin-right: 8px;
        }
        
        .date-buttons,
        .time-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .date-button,
        .time-button {
            padding: 18px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            text-align: left;
        }
        
        .date-button:hover,
        .time-button:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .date-button.selected,
        .time-button.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        
        .date-button {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .date-main {
            flex: 1;
        }
        
        .date-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .date-time {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .date-badge {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .date-button.selected .date-badge {
            background: rgba(255,255,255,0.3);
        }
        
        .time-button {
            text-align: center;
        }
        
        .time-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .time-badge {
            font-size: 0.85rem;
            opacity: 0.8;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .required {
            color: #ef4444;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-submit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 30px;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        
        .loading-overlay.show {
            display: flex;
        }
        
        .loading-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .loading-subtext {
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">🚢</div>
            <h1>備前丸市民限定内覧会</h1>
        </div>
        
        <form id="reservationForm">
            <div class="section-title">
                <span class="icon">📅</span>
                ご希望の日付を選択してください
            </div>
            <div class="date-buttons" id="dateButtons"></div>
            <input type="hidden" id="date" name="date" required>
            
            <div class="section-title">
                <span class="icon">⏰</span>
                ご希望の時間帯を選択してください
            </div>
            <div class="time-buttons" id="timeButtons"></div>
            <input type="hidden" id="timeSlot" name="timeSlot" required>
            
            <div class="form-group">
                <label>👤 お名前 <span class="required">※</span></label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label>🎂 年齢 <span class="required">※</span></label>
                <input type="number" id="age" name="age" min="0" max="120" required>
            </div>
            
            <div class="form-group">
                <label>👥 性別 <span class="required">※</span></label>
                <select id="gender" name="gender" required>
                    <option value="">選択してください</option>
                    <option value="男性">男性</option>
                    <option value="女性">女性</option>
                    <option value="その他">その他</option>
                    <option value="回答しない">回答しない</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>📮 郵便番号 <span class="required">※</span></label>
                <input type="text" id="postalCode" name="postalCode" required>
            </div>
            
            <div class="form-group">
                <label>🏠 住所 <span class="required">※</span></label>
                <input type="text" id="address" name="address" required>
            </div>
            
            <div class="form-group">
                <label>📞 電話番号 <span class="required">※</span></label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            
            <div class="form-group">
                <label>📧 メールアドレス <span class="required">※</span></label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <button type="submit" class="btn-submit">予約を確定する</button>
        </form>
    </div>
    
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">予約を処理中...</div>
            <div class="loading-subtext" id="loadingSubtext">しばらくお待ちください</div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLpyqMk8xbnNfDz5H2DHhH_ZLNBSEWDG2pI11zrnRkCFwf3uVvHgrYpr1Asi0ijA1n/exec';
        
        const dates = [
            { date: '2026-02-27', display: '2月27日（金）', count: 13 },
            { date: '2026-03-27', display: '3月27日（金）', count: 3 },
            { date: '2026-03-28', display: '3月28日（土）', count: 5 }
        ];
        
        const times = [
            { time: '09:00-10:00', count: 9 },
            { time: '10:00-11:00', count: 8 },
            { time: '11:00-12:00', count: 7 },
            { time: '13:00-14:00', count: 6 },
            { time: '14:00-15:00', count: 5 }
        ];
        
        function initDateButtons() {
            const container = document.getElementById('dateButtons');
            dates.forEach(d => {
                const btn = document.createElement('div');
                btn.className = 'date-button';
                btn.dataset.date = d.date;
                btn.innerHTML = `
                    <div class="date-main">
                        <div class="date-title">${d.display}</div>
                        <div class="date-time">09:00〜15:00</div>
                    </div>
                    <div class="date-badge">${d.count}件予約</div>
                `;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.date-button').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    document.getElementById('date').value = d.date;
                });
                container.appendChild(btn);
            });
        }
        
        function initTimeButtons() {
            const container = document.getElementById('timeButtons');
            times.forEach(t => {
                const btn = document.createElement('div');
                btn.className = 'time-button';
                btn.dataset.time = t.time;
                btn.innerHTML = `
                    <div class="time-title">${t.time}</div>
                    <div class="time-badge">${t.count}件予約</div>
                `;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.time-button').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    document.getElementById('timeSlot').value = t.time;
                });
                container.appendChild(btn);
            });
        }
        
        document.getElementById('reservationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!document.getElementById('date').value) {
                alert('日付を選択してください');
                return;
            }
            
            if (!document.getElementById('timeSlot').value) {
                alert('時間帯を選択してください');
                return;
            }
            
            const formData = {
                category: '市民',
                date: document.getElementById('date').value,
                timeSlot: document.getElementById('timeSlot').value,
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                postalCode: document.getElementById('postalCode').value,
                address: document.getElementById('address').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value
            };
            
            const confirmed = confirm(`以下の内容で予約します。よろしいですか？\n\nお名前: ${formData.name}\n日付: ${formData.date}\n時間枠: ${formData.timeSlot}`);
            
            if (!confirmed) return;
            
            showLoading('予約を処理中...', 'スプレッドシートに保存しています');
            
            try {
                const params = new URLSearchParams(formData);
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: params,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    updateLoading('メール送信中...', '確認メールを送信しています');
                    await new Promise(resolve => setTimeout(resolve, 3000));
                    updateLoading('完了！', 'チケット画面を表示します');
                    setTimeout(() => {
                        window.location.href = `ticket-citizen.html?id=${data.ticketId}`;
                    }, 1000);
                } else {
                    hideLoading();
                    alert('予約に失敗しました:\n' + (data.message || '不明なエラー'));
                }
            } catch (error) {
                hideLoading();
                alert('通信エラーが発生しました。\nもう一度お試しください。');
            }
        });
        
        function showLoading(text, subtext) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingSubtext').textContent = subtext;
            document.getElementById('loadingOverlay').classList.add('show');
        }
        
        function updateLoading(text, subtext) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingSubtext').textContent = subtext;
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('show');
        }
        
        initDateButtons();
        initTimeButtons();
    </script>
</body>
</html>
