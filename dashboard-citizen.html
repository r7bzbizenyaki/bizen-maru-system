<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダッシュボード - 備前丸市民限定内覧会</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.95;
        }
        
        .last-update {
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
            font-size: 13px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        
        .stat-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-value {
            font-size: 42px;
            font-weight: bold;
            color: #667eea;
            line-height: 1;
        }
        
        .stat-value.onboard {
            color: #4CAF50;
        }
        
        .records-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .records-section h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .records-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .records-table th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-size: 13px;
            color: #666;
            font-weight: 600;
            border-bottom: 2px solid #e9ecef;
        }
        
        .records-table td {
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
            font-size: 14px;
        }
        
        .records-table tr:hover {
            background: #f8f9fa;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge.boarding {
            background: #d4edda;
            color: #155724;
        }
        
        .badge.alighting {
            background: #fff3cd;
            color: #856404;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .records-table {
                font-size: 12px;
            }
            
            .records-table th,
            .records-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 リアルタイムダッシュボード</h1>
            <p>備前丸市民限定内覧会</p>
            <div class="last-update" id="lastUpdate">
                更新中...
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">🚢</div>
                <div class="stat-label">総乗船数</div>
                <div class="stat-value" id="totalBoarding">-</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">⚓</div>
                <div class="stat-label">総下船数</div>
                <div class="stat-value" id="totalAlighting">-</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-label">現在船内</div>
                <div class="stat-value onboard" id="currentOnboard">-</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">⏱️</div>
                <div class="stat-label">平均滞在時間</div>
                <div class="stat-value" id="avgStay">-</div>
            </div>
        </div>
        
        <div class="records-section">
            <h2>📋 最近の記録</h2>
            
            <div id="loadingArea" class="loading">
                <div class="spinner"></div>
                <p>データを読み込んでいます...</p>
            </div>
            
            <div id="tableArea" style="display: none;">
                <table class="records-table">
                    <thead>
                        <tr>
                            <th>時刻</th>
                            <th>種別</th>
                            <th>チケットID</th>
                            <th>予約者名</th>
                        </tr>
                    </thead>
                    <tbody id="recordsBody">
                    </tbody>
                </table>
            </div>
            
            <div id="noDataArea" class="no-data" style="display: none;">
                <p>まだ記録がありません</p>
            </div>
        </div>
    </div>
    
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLpyqMk8xbnNfDz5H2DHhH_ZLNBSEWDG2pI11zrnRkCFwf3uVvHgrYpr1Asi0ijA1n/exec';
        
        // 統計データ取得
        async function fetchStats() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getDashboardData`);
                const data = await response.json();
                
                if (data.success) {
                    updateStats(data);
                    updateRecords(data.recentRecords || []);
                    updateLastUpdate();
                }
            } catch (error) {
                console.error('データ取得エラー:', error);
            }
        }
        
        // 統計表示更新
        function updateStats(data) {
            document.getElementById('totalBoarding').textContent = data.boarding || 0;
            document.getElementById('totalAlighting').textContent = data.alighting || 0;
            document.getElementById('currentOnboard').textContent = 
                (data.boarding || 0) - (data.alighting || 0);
            
            if (data.avgStay) {
                document.getElementById('avgStay').textContent = data.avgStay;
            } else {
                document.getElementById('avgStay').textContent = '-';
            }
        }
        
        // 記録一覧更新
        function updateRecords(records) {
            const tbody = document.getElementById('recordsBody');
            const loadingArea = document.getElementById('loadingArea');
            const tableArea = document.getElementById('tableArea');
            const noDataArea = document.getElementById('noDataArea');
            
            loadingArea.style.display = 'none';
            
            if (!records || records.length === 0) {
                tableArea.style.display = 'none';
                noDataArea.style.display = 'block';
                return;
            }
            
            noDataArea.style.display = 'none';
            tableArea.style.display = 'block';
            
            tbody.innerHTML = '';
            
            records.forEach(record => {
                const row = document.createElement('tr');
                
                const time = new Date(record.timestamp);
                const timeStr = time.toLocaleTimeString('ja-JP', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                
                row.innerHTML = `
                    <td>${timeStr}</td>
                    <td><span class="badge ${record.type === '乗船' ? 'boarding' : 'alighting'}">${record.type}</span></td>
                    <td>${record.ticketId}</td>
                    <td>${record.name || '-'}</td>
                `;
                
                tbody.appendChild(row);
            });
        }
        
        // 最終更新時刻表示
        function updateLastUpdate() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ja-JP');
            document.getElementById('lastUpdate').textContent = `最終更新: ${timeStr}`;
        }
        
        // 初回読み込み
        fetchStats();
        
        // 5秒ごとに自動更新
        setInterval(fetchStats, 5000);
    </script>
</body>
</html>
