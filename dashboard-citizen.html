<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 リアルタイムダッシュボード</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .subtitle {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .update-time {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 20px;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
    }

    .stat-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .stat-label {
      font-size: 1rem;
      color: #666;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: bold;
      color: #667eea;
    }

    .stat-value.green {
      color: #48bb78;
    }

    .recent-section {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 1.5rem;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #f7fafc;
    }

    th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
      color: #4a5568;
      border-bottom: 2px solid #e2e8f0;
    }

    td {
      padding: 15px;
      border-bottom: 1px solid #e2e8f0;
    }

    tbody tr:hover {
      background: #f7fafc;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-boarded {
      background: #c6f6d5;
      color: #22543d;
    }

    .status-disembarked {
      background: #fed7d7;
      color: #742a2a;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.8rem;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 0.9rem;
      }

      th, td {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 リアルタイムダッシュボード</h1>
      <div class="subtitle">備前丸市民限定内覧会</div>
      <div class="update-time" id="updateTime">最終更新: 18:00:47</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">🚢</div>
        <div class="stat-label">総乗船数</div>
        <div class="stat-value" id="totalBoarding">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">⚓</div>
        <div class="stat-label">総下船数</div>
        <div class="stat-value" id="totalDisembarking">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <div class="stat-label">現在船内</div>
        <div class="stat-value green" id="currentOnboard">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">⏱️</div>
        <div class="stat-label">平均滞在時間</div>
        <div class="stat-value" id="averageStay">-</div>
      </div>
    </div>

    <div class="recent-section">
      <div class="section-header">
        📋 最近の記録
      </div>
      <table>
        <thead>
          <tr>
            <th>時刻</th>
            <th>種別</th>
            <th>予約時間</th>
            <th>予約者名</th>
          </tr>
        </thead>
        <tbody id="recentTableBody">
          <tr>
            <td colspan="4" class="loading">データを読み込んでいます...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLpyqMk8xbnNfDz5H2DHhH_ZLNBSEWDG2pI11zrnRkCFwf3uVvHgrYpr1Asi0ijA1n/exec';

    async function fetchStats() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getDashboardData`);
        const data = await response.json();

        if (data.success) {
          document.getElementById('totalBoarding').textContent = data.totalBoarding;
          document.getElementById('totalDisembarking').textContent = data.totalDisembarking;
          document.getElementById('currentOnboard').textContent = data.currentOnboard;
          
          const avgStay = data.averageStayMinutes > 0 
            ? `${data.averageStayMinutes}分` 
            : '-';
          document.getElementById('averageStay').textContent = avgStay;

          const recentTableBody = document.getElementById('recentTableBody');
          if (data.recentRecords && data.recentRecords.length > 0) {
            recentTableBody.innerHTML = data.recentRecords.map(record => {
              let displayTime = '-';
              if (record.boardingTime) {
                try {
                  const date = new Date(record.boardingTime);
                  if (!isNaN(date.getTime())) {
                    displayTime = date.toLocaleString('ja-JP', {
                      year: 'numeric',
                      month: '2-digit',
                      day: '2-digit',
                      hour: '2-digit',
                      minute: '2-digit'
                    });
                  } else {
                    displayTime = record.boardingTime;
                  }
                } catch (e) {
                  displayTime = record.boardingTime || '-';
                }
              }

              return `
                <tr>
                  <td>${displayTime}</td>
                  <td><span class="status-badge ${record.status === '乗船済' ? 'status-boarded' : 'status-disembarked'}">${record.status || '-'}</span></td>
                  <td>${record.time || '-'}</td>
                  <td>${record.name || '-'}</td>
                </tr>
              `;
            }).join('');
          } else {
            recentTableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#999;">記録がありません</td></tr>';
          }

          const now = new Date();
          document.getElementById('updateTime').textContent = 
            `最終更新: ${now.toLocaleTimeString('ja-JP')}`;
        }
      } catch (error) {
        console.error('データ取得エラー:', error);
        document.getElementById('recentTableBody').innerHTML = 
          '<tr><td colspan="4" style="text-align:center; color:red;">データの読み込みに失敗しました</td></tr>';
      }
    }

    fetchStats();
    setInterval(fetchStats, 5000);
  </script>
</body>
</html>
