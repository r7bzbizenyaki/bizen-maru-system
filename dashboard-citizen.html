<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダッシュボード - 備前丸市民限定内覧会</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.95;
        }
        
        /* 統計カードグリッド */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card.highlight {
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            color: white;
        }
        
        .stat-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        .stat-number {
            font-size: 3rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .stat-card.highlight .stat-number {
            color: white;
        }
        
        .stat-label {
            font-size: 1rem;
            color: #666;
            font-weight: 600;
        }
        
        .stat-card.highlight .stat-label {
            color: white;
            font-weight: 700;
        }
        
        .content-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .card-title {
            font-size: 1.5rem;
            color: #333;
            font-weight: 600;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f3f4f6;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e5e7eb;
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }
        
        .status-boarded {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status-completed {
            background: #e0e7ff;
            color: #3730a3;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
        }
        
        .footer a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            display: inline-block;
            margin: 5px;
            transition: background 0.3s;
        }
        
        .footer a:hover {
            background: rgba(255,255,255,0.3);
        }
        
        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .card-header {
                flex-direction: column;
                align-items: stretch;
            }
            
            .btn {
                width: 100%;
            }
            
            table {
                font-size: 0.85rem;
            }
            
            th, td {
                padding: 10px 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 リアルタイムダッシュボード</h1>
            <p>備前丸市民限定内覧会 - 乗船管理システム</p>
        </div>
        
        <!-- 統計カード -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card highlight">
                <div class="stat-icon">📋</div>
                <div class="stat-number" id="totalReservations">-</div>
                <div class="stat-label">総予約数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-number" id="totalBoarded">-</div>
                <div class="stat-label">乗船済み</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏁</div>
                <div class="stat-number" id="totalDisembarked">-</div>
                <div class="stat-label">下船済み</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🚢</div>
                <div class="stat-number" id="currentOnboard">-</div>
                <div class="stat-label">現在船内</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏱️</div>
                <div class="stat-number" id="avgStayTime">-</div>
                <div class="stat-label">平均滞在時間</div>
            </div>
        </div>
        
        <!-- 最新記録 -->
        <div class="content-card">
            <div class="card-header">
                <h2 class="card-title">📝 最新20件の記録</h2>
                <div>
                    <button class="btn btn-secondary" onclick="refreshData()">🔄 更新</button>
                    <button class="btn btn-primary" onclick="exportCSV()">📥 CSVエクスポート</button>
                </div>
            </div>
            
            <div id="recordsTable">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>データを読み込んでいます...</p>
                </div>
            </div>
        </div>
        
        <!-- データ管理 -->
        <div class="content-card">
            <div class="card-header">
                <h2 class="card-title">🛠️ データ管理</h2>
                <button class="btn btn-danger" onclick="confirmClearData()">🗑️ 全データクリア</button>
            </div>
            <p style="color: #666;">※ データクリアは管理者パスワードが必要です</p>
        </div>
        
        <div class="footer">
            <a href="https://r7bzbizenyaki.github.io/bizen-maru-system/scan-citizen.html">📱 スキャン画面へ</a>
            <a href="https://r7bzbizenyaki.github.io/bizen-maru-system/entry-form-citizen.html">📝 予約フォームへ</a>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLpyqMk8xbnNfDz5H2DHhH_ZLNBSEWDG2pI11zrnRkCFwf3uVvHgrYpr1Asi0ijA1n/exec';
        
        async function loadDashboardData() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getDashboardData&category=市民`);
                const data = await response.json();
                
                if (data.success) {
                    updateStats(data.stats);
                    updateRecordsTable(data.records);
                } else {
                    showError('データの読み込みに失敗しました');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('サーバーとの通信に失敗しました');
            }
        }
        
        function updateStats(stats) {
            document.getElementById('totalReservations').textContent = stats.totalReservations || 0;
            document.getElementById('totalBoarded').textContent = stats.totalBoarded || 0;
            document.getElementById('totalDisembarked').textContent = stats.totalDisembarked || 0;
            document.getElementById('currentOnboard').textContent = stats.currentOnboard || 0;
            document.getElementById('avgStayTime').textContent = stats.avgStayTime ? stats.avgStayTime + '分' : '-';
        }
        
        function updateRecordsTable(records) {
            const container = document.getElementById('recordsTable');
            
            if (!records || records.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <p>まだ記録がありません</p>
                    </div>
                `;
                return;
            }
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>チケットID</th>
                            <th>お名前</th>
                            <th>予約日</th>
                            <th>時間枠</th>
                            <th>ステータス</th>
                            <th>乗船時刻</th>
                            <th>下船時刻</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            records.forEach(record => {
                let statusClass = 'status-pending';
                let statusText = '🕒 未乗船';
                
                if (record.boardingStatus === '下船済み') {
                    statusClass = 'status-completed';
                    statusText = '✅ 下船完了';
                } else if (record.boardingStatus === '乗船済み') {
                    statusClass = 'status-boarded';
                    statusText = '🚢 乗船中';
                }
                
                html += `
                    <tr>
                        <td><code>${record.ticketId}</code></td>
                        <td>${record.name}</td>
                        <td>${record.date}</td>
                        <td>${record.timeSlot}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>${record.boardingTime || '-'}</td>
                        <td>${record.disembarkingTime || '-'}</td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
            `;
            
            container.innerHTML = html;
        }
        
        function showError(message) {
            const container = document.getElementById('recordsTable');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">❌</div>
                    <p>${message}</p>
                    <button class="btn btn-primary" onclick="refreshData()" style="margin-top:20px;">再試行</button>
                </div>
            `;
        }
        
        function refreshData() {
            document.getElementById('recordsTable').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>データを更新しています...</p>
                </div>
            `;
            loadDashboardData();
        }
        
        async function exportCSV() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getDashboardData&category=市民`);
                const data = await response.json();
                
                if (!data.success || !data.recentRecords || data.recentRecords.length === 0) {
                    alert('エクスポートするデータがありません');
                    return;
                }
                
                let csv = '\ufeff'; // BOM for Excel
                csv += 'チケットID,お名前,予約日,時間枠,ステータス,乗船時刻,下船時刻\n';
                
                data.records.forEach(record => {
                    csv += `"${record.ticketId}",`;
                    csv += `"${record.name}",`;
                    csv += `"${record.date}",`;
                    csv += `"${record.timeSlot}",`;
                    csv += `"${record.boardingStatus}",`;
                    csv += `"${record.boardingTime || ''}",`;
                    csv += `"${record.disembarkingTime || ''}"\n`;
                });
                
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                
                link.setAttribute('href', url);
                link.setAttribute('download', `備前丸_乗船記録_${new Date().toISOString().split('T')[0]}.csv`);
                link.style.visibility = 'hidden';
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
            } catch (error) {
                console.error('Error:', error);
                alert('CSVエクスポートに失敗しました');
            }
        }
        
        async function confirmClearData() {
            const password = prompt('管理者パスワードを入力してください:');
            
            if (!password) return;
            
            if (!confirm('本当に全データをクリアしますか?\nこの操作は取り消せません。')) {
                return;
            }
            
            try {
                const response = await fetch(`${SCRIPT_URL}?action=clearAllData&password=${encodeURIComponent(password)}`);
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ 全データをクリアしました');
                    refreshData();
                } else {
                    alert('❌ ' + (data.message || 'データクリアに失敗しました'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('❌ サーバーとの通信に失敗しました');
            }
        }
        
        // 初期読み込み
        window.addEventListener('DOMContentLoaded', loadDashboardData);
        
        // 30秒ごとに自動更新
        setInterval(refreshData, 30000);
    </script>
</body>
</html>
